<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <!-- Grid Lines -->
  <g stroke="rgba(0, 240, 255, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Neural Nodes & Connections -->
  <path d="M 250 225 L 350 150 L 450 225 L 350 300 Z M 350 150 L 550 150 M 450 225 L 550 300 M 350 300 L 550 300" stroke="url(#glowGrad)" stroke-width="2" fill="none" opacity="0.7"/>
  <circle cx="250" cy="225" r="16" fill="url(#glowGrad)" opacity="0.9"/>
  <circle cx="350" cy="150" r="22" fill="#00f0ff" opacity="0.9"/>
  <circle cx="450" cy="225" r="28" fill="#7000ff" opacity="0.9"/>
  <circle cx="350" cy="300" r="18" fill="#00f0ff" opacity="0.9"/>
  <circle cx="550" cy="150" r="20" fill="#7000ff" opacity="0.9"/>
  <circle cx="550" cy="300" r="24" fill="url(#glowGrad)" opacity="0.9"/>
  <!-- Central Pulse -->
  <circle cx="400" cy="225" r="70" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <!-- Text Label -->
  <rect x="50" y="40" width="220" height="40" rx="8" fill="rgba(0, 240, 255, 0.15)" stroke="rgba(0, 240, 255, 0.3)"/>
  <text x="160" y="65" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">AI &amp; MACHINE LEARNING</text>
</svg>
