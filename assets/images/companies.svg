<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <!-- Skyline / Buildings -->
  <rect x="150" y="160" width="100" height="230" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <rect x="280" y="100" width="130" height="290" fill="url(#buildingGrad)" opacity="0.9"/>
  <rect x="440" y="140" width="110" height="250" fill="rgba(59, 130, 246, 0.4)" stroke="#3b82f6" stroke-width="1"/>
  <rect x="570" y="200" width="90" height="190" fill="rgba(59, 130, 246, 0.2)"/>
  <!-- Windows -->
  <g fill="#60a5fa" opacity="0.7">
    <rect x="300" y="130" width="20" height="20" rx="3"/>
    <rect x="335" y="130" width="20" height="20" rx="3"/>
    <rect x="370" y="130" width="20" height="20" rx="3"/>
    <rect x="300" y="170" width="20" height="20" rx="3"/>
    <rect x="335" y="170" width="20" height="20" rx="3"/>
    <rect x="370" y="170" width="20" height="20" rx="3"/>
    <rect x="300" y="210" width="20" height="20" rx="3"/>
    <rect x="335" y="210" width="20" height="20" rx="3"/>
    <rect x="370" y="210" width="20" height="20" rx="3"/>
  </g>
  <!-- Label -->
  <rect x="50" y="40" width="210" height="40" rx="8" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.4)"/>
  <text x="155" y="65" fill="#60a5fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">TECH &amp; IT COMPANIES</text>
</svg>
