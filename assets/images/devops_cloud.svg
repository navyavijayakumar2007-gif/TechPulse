<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <!-- Cloud & DevOps Infinity Loop -->
  <path d="M 320 225 Q 260 170 230 225 Q 260 280 320 225 Q 380 170 480 225 Q 540 280 570 225 Q 540 170 480 225 Q 420 280 320 225 Z" fill="none" stroke="#7dd3fc" stroke-width="4"/>
  <!-- Cloud Circles -->
  <circle cx="380" cy="180" r="30" fill="url(#cloudGrad)" opacity="0.8"/>
  <circle cx="420" cy="170" r="40" fill="url(#cloudGrad)" opacity="0.9"/>
  <circle cx="460" cy="180" r="30" fill="url(#cloudGrad)" opacity="0.8"/>
  <!-- Label -->
  <rect x="50" y="40" width="200" height="40" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.4)"/>
  <text x="150" y="65" fill="#7dd3fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">DEVOPS &amp; CLOUD</text>
</svg>
