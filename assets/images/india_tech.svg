  </g>
  <!-- Label -->
  <rect x="50" y="40" width="230" height="40" rx="8" fill="rgba(249, 115, 22, 0.2)" stroke="rgba(249, 115, 22, 0.4)"/>
  <text x="165" y="65" fill="#f97316" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">INDIAN TECH NEWS</text>
