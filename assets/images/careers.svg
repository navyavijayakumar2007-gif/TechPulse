<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="careerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <!-- Growth Bars Graph -->
  <g stroke="rgba(16, 185, 129, 0.15)" stroke-width="1">
    <line x1="100" y1="360" x2="700" y2="360"/>
    <line x1="100" y1="280" x2="700" y2="280"/>
    <line x1="100" y1="200" x2="700" y2="200"/>
    <line x1="100" y1="120" x2="700" y2="120"/>
  </g>
  <rect x="180" y="240" width="60" height="120" rx="6" fill="rgba(16, 185, 129, 0.4)"/>
  <rect x="280" y="190" width="60" height="170" rx="6" fill="rgba(16, 185, 129, 0.6)"/>
  <rect x="380" y="140" width="60" height="220" rx="6" fill="url(#careerGrad)"/>
  <rect x="480" y="100" width="60" height="260" rx="6" fill="url(#careerGrad)"/>
  <!-- Trend Arrow -->
  <path d="M 160 270 Q 320 200 560 80" stroke="#00f0ff" stroke-width="4" fill="none"/>
  <polygon points="560,70 575,85 550,90" fill="#00f0ff"/>
  <!-- Category Label -->
  <rect x="50" y="40" width="180" height="40" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)"/>
  <text x="140" y="65" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">CAREER &amp; JOBS</text>
</svg>
