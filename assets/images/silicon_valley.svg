<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="valleyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <!-- Golden Gate Bridge silhouette / Tech Highway -->
  <path d="M 100 350 L 250 200 L 400 350 L 550 180 L 700 350" stroke="url(#valleyGrad)" stroke-width="4" fill="none"/>
  <circle cx="250" cy="200" r="12" fill="#ec4899"/>
  <circle cx="550" cy="180" r="12" fill="#8b5cf6"/>
  <!-- Label -->
  <rect x="50" y="40" width="180" height="40" rx="8" fill="rgba(236, 72, 153, 0.2)" stroke="rgba(236, 72, 153, 0.4)"/>
  <text x="140" y="65" fill="#f472b6" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">SILICON VALLEY</text>
</svg>
